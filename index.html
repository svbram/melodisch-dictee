<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>melodisch dictee</title>

<link rel="stylesheet" href="css/stijl.css">
</head>

<body>

<div class="kaart">

<h1>melodisch dictee</h1>

<div class="info">
    kies de intervallen, richting, beginnoot en het aantal noten.
</div>


<!-- =====================================================
     INTERVALLEN + INSTELLINGEN
     ===================================================== -->

<div class="keuzeblok">

    <div class="interval-keuze">

        <div class="interval-titel">
            intervallen
        </div>

        <div class="interval-opties">

            <label>
                <input type="checkbox" id="intervalKleineSecunde">
                kleine secunde
            </label>

            <label>
                <input type="checkbox" id="intervalGroteSecunde" checked>
                grote secunde
            </label>

            <label>
                <input type="checkbox" id="intervalKwart">
                kwart
            </label>

            <label>
                <input type="checkbox" id="intervalKwint" checked>
                kwint
            </label>

            <label>
                <input type="checkbox" id="intervalOctaaf">
                octaaf
            </label>

        </div>

    </div>


    <div class="instellingen">

        <div class="instelling">

            <label for="aantalNoten">
                aantal noten
            </label>

            <input
                type="number"
                id="aantalNoten"
                min="2"
                max="32"
            >

        </div>


        <div class="instelling">

            <label for="richting">
                richting
            </label>

            <select id="richting">

                <option value="stijgend">
                    stijgend
                </option>

                <option value="dalend">
                    dalend
                </option>

                <option value="beide" selected>
                    beide
                </option>

            </select>

        </div>


        <div class="instelling">

            <label for="beginnoot">
                beginnoot
            </label>

            <select id="beginnoot">

                <option value="60" selected>C</option>
                <option value="61">C♯</option>
                <option value="62">D</option>
                <option value="63">E♭</option>
                <option value="64">E</option>
                <option value="65">F</option>
                <option value="66">F♯</option>
                <option value="67">G</option>
                <option value="68">A♭</option>
                <option value="69">A</option>
                <option value="70">B♭</option>
                <option value="71">B</option>

            </select>

        </div>

    </div>

</div>


<!-- =====================================================
     KNOPPEN
     ===================================================== -->

<div class="knoppen">

    <button id="nieuwKnop">
        nieuw dictee
    </button>

    <button id="speelKnop">
        ▶ afspelen
    </button>

    <button id="oplossingKnop">
        toon oplossing
    </button>

    <br>

    <button id="audioResetKnop" class="audio-reset">
        reset audio
    </button>

</div>


<!-- =====================================================
     TEMPO
     ===================================================== -->

<div class="tempo">

    <label for="tempo">
        tempo:
        <strong>
            <span id="tempoWaarde"></span> BPM
        </strong>
    </label>

    <br>

    <input
        type="range"
        id="tempo"
        min="20"
        max="120"
        step="5"
    >

    <div class="tempo-schaal">
        <span>20</span>
        <span>70</span>
        <span>120</span>
    </div>

</div>


<div id="melding"></div>
<div id="audioStatus">piano: nog niet geladen</div>


<div id="oplossing">

    <canvas
        id="notenbalk"
        width="760"
        height="360">
    </canvas>

</div>


<div class="credits">
    piano samples: Salamander Grand Piano —
    Alexander Holm, CC BY 3.0
</div>

</div>


<script src="js/app.js"></script>

</body>
</html>
